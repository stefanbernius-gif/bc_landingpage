name: BMB weekly price bands

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC (06:00 Mexico City)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: bmb-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull AMPI list and rebuild price bands
        env:
          AMPI_IID: ${{ secrets.AMPI_IID }}
        run: python3 .github/scripts/bmb_weekly.py
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bill-barroso/segs_m2.json
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "bill-barroso: weekly price bands $(date -u +%Y-%m-%d)"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Request Pages build
        if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
